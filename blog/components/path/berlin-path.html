<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>component · berlin shortest path (hidden travel times)</title>
<!--
  COMPONENT SPEC
  Shows: a road network on the 52 berlin points with HIDDEN per-edge travel
         times. Two policies race on one regret chart: CombUCB-on-edges
         (Dijkstra on per-edge LCBs, observe every edge it drives) vs
         route-as-an-arm (UCB1 over K whole routes, observe only total cost).
  Feel:  "reusing per-edge knowledge across routes (semi-bandit) crushes
         treating each route as one opaque arm." CombUCB's gap→0 fast; the
         arm bandit crawls.
  Knob:  noise σ (relative). Map colour=mean estimate, thickness=uncertainty.
-->
<style>
:root{--bg:#0b1220;--card:#131c30;--card2:#1a2440;--fg:#e6edf3;--dim:#8b95a8;--accent:#4c8df6;--accent2:#2a4a7a;--good:#5fd2a3;--warn:#f0a058;--bad:#e16c6c;--gold:#f5c451;--purple:#c879f0;--border:#1f2a44;--code:#0e1626;--mono:ui-monospace,Menlo,Monaco,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{padding:24px 16px 80px}
.harness{max-width:860px;margin:0 auto}
.harness h1{font-size:18px;font-family:var(--mono);color:var(--dim);font-weight:600}
.bp-root{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--fg)}
.bp-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
@media(max-width:680px){.bp-grid{grid-template-columns:1fr}}
.bp-map{display:block;width:100%;height:330px;background:var(--code);border:1px solid var(--border);border-radius:8px;cursor:crosshair}
.bp-chart{display:block;width:100%;height:330px;background:var(--code);border:1px solid var(--border);border-radius:8px}
.bp-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(max-width:600px){.bp-cards{grid-template-columns:repeat(3,1fr)}}
.bp-card{background:var(--code);border:1px solid var(--border);border-left-width:3px;border-radius:8px;padding:8px 10px}
.bp-card .n{font-family:var(--mono);font-size:11px;font-weight:600}
.bp-card .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px}
.bp-card .row b{color:var(--fg)}
.bp-controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}
.bp-controls button{font-family:var(--mono);font-size:12.5px;background:var(--card2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 11px;cursor:pointer}
.bp-controls button:hover{background:var(--accent2);border-color:var(--accent)}
.bp-controls button.primary{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:600}
.bp-controls button.on{background:var(--purple);color:#0b1220;border-color:var(--purple);font-weight:600}
.bp-controls label{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
.bp-note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5}
.bp-note b{color:var(--good)}
.bp-note .gold{color:var(--gold)}.bp-note .blue{color:var(--accent)}
</style>
</head>
<body>
<div class="harness">
  <h1>component · path/berlin-path</h1>
  <div id="stage"></div>
</div>
<script>
// ============================ PURE LOGIC (no DOM) ============================
const COLORS={blue:'#4c8df6',green:'#5fd2a3',orange:'#f0a058',purple:'#c879f0',red:'#e16c6c',gold:'#f5c451',dim:'#8b95a8',fg:'#e6edf3'};
function rng(seed){let s=seed|0||1;return function(){s=(s+0x6D2B79F5)|0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(rand){const u=rand()||1e-12,v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

// berlin52 coordinates (TSPLIB Groetschel), inlined — no network.
const BERLIN=[[565,575],[25,185],[345,750],[945,685],[845,655],[880,660],[25,230],[525,1000],[580,1175],[650,1130],[1605,620],[1220,580],[1465,200],[1530,5],[845,680],[725,370],[145,665],[415,635],[510,875],[560,365],[300,465],[520,585],[480,415],[835,625],[975,580],[1215,245],[1320,315],[1250,400],[660,180],[410,250],[420,555],[575,665],[1150,1160],[700,580],[685,595],[685,610],[770,610],[795,645],[720,635],[760,650],[475,960],[95,260],[875,920],[700,500],[555,815],[830,485],[1170,65],[830,610],[605,625],[595,360],[1340,725],[1740,245]];

function dist(a,b){const dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy);}

// Build undirected k-NN graph over the points, ensure connectivity.
// Edge "true mean" = euclidean * (1 + congestion), congestion in ~[0,0.6]
// from a seeded RNG keyed by edge index (deterministic per reset seed).
function buildGraph(pts,k,seed){
  const n=pts.length;
  const edgeSet=new Map();         // "i,j" -> edge index, i<j
  const edges=[];                  // {u,v,len}
  const addEdge=(a,b)=>{const u=Math.min(a,b),v=Math.max(a,b);if(u===v)return;const key=u+','+v;if(edgeSet.has(key))return;edgeSet.set(key,edges.length);edges.push({u,v,len:dist(pts[u],pts[v])});};
  for(let i=0;i<n;i++){
    const order=[...Array(n).keys()].filter(j=>j!==i).sort((a,b)=>dist(pts[i],pts[a])-dist(pts[i],pts[b]));
    for(let t=0;t<k&&t<order.length;t++)addEdge(i,order[t]);
  }
  // ensure connected: union-find, link nearest cross-component pairs.
  const parent=[...Array(n).keys()];
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  const uni=(a,b)=>{parent[find(a)]=find(b);};
  for(const e of edges)uni(e.u,e.v);
  let guard=0;
  while(guard++<n){
    const comps={};for(let i=0;i<n;i++){const r=find(i);(comps[r]=comps[r]||[]).push(i);}
    const keys=Object.keys(comps);if(keys.length<=1)break;
    // connect comp0 to nearest node in any other comp
    let best=null,bd=Infinity;const c0=comps[keys[0]];
    for(const i of c0)for(let j=0;j<n;j++){if(find(j)===find(i))continue;const d=dist(pts[i],pts[j]);if(d<bd){bd=d;best=[i,j];}}
    if(!best)break;addEdge(best[0],best[1]);uni(best[0],best[1]);
  }
  // adjacency: node -> list of {to, e}
  const adj=Array.from({length:n},()=>[]);
  edges.forEach((e,idx)=>{adj[e.u].push({to:e.v,e:idx});adj[e.v].push({to:e.u,e:idx});});
  // deterministic congestion per edge from seeded rng
  const R=rng(seed*2654435761>>>0||1);
  const mean=edges.map(e=>{const cong=0.6*R();return e.len*(1+cong);});
  return {n,edges,adj,mean};
}

// Dijkstra on a per-edge weight array w[edgeIdx]. Returns {cost,path(node list),edgesUsed}.
function dijkstra(graph,w,src,dst){
  const n=graph.n,d=new Array(n).fill(Infinity),prevE=new Array(n).fill(-1),prevN=new Array(n).fill(-1),done=new Array(n).fill(false);
  d[src]=0;
  for(let it=0;it<n;it++){
    let u=-1,bu=Infinity;for(let i=0;i<n;i++)if(!done[i]&&d[i]<bu){bu=d[i];u=i;}
    if(u===-1)break;done[u]=true;if(u===dst)break;
    for(const{to,e}of graph.adj[u]){const nd=d[u]+w[e];if(nd<d[to]){d[to]=nd;prevE[to]=e;prevN[to]=u;}}
  }
  if(d[dst]===Infinity)return null;
  const path=[],edgesUsed=[];let c=dst;while(c!==src&&c!==-1){path.push(c);edgesUsed.push(prevE[c]);c=prevN[c];}
  path.push(src);path.reverse();edgesUsed.reverse();
  return {cost:d[dst],path,edgesUsed};
}

// True cost of an edge list under the hidden means.
function trueCostOfEdges(graph,edgesUsed){let s=0;for(const e of edgesUsed)s+=graph.mean[e];return s;}

// k-shortest-ish distinct routes via randomized-perturbation Dijkstra on len.
function enumerateRoutes(graph,src,dst,K,seed){
  const R=rng(seed*40503>>>0||7);
  const routes=[],seen=new Set();
  // first: the length-optimal route (no perturbation)
  const baseW=graph.edges.map(e=>e.len);
  const r0=dijkstra(graph,baseW,src,dst);
  if(r0){routes.push(r0.edgesUsed);seen.add(r0.edgesUsed.join(','));}
  let tries=0;
  while(routes.length<K&&tries++<400){
    const w=graph.edges.map(e=>e.len*(1+1.4*R()));   // perturb lengths
    const r=dijkstra(graph,w,src,dst);if(!r)continue;
    const key=r.edgesUsed.join(',');
    if(!seen.has(key)){seen.add(key);routes.push(r.edgesUsed);}
  }
  return routes;
}

// ---- the simulator: holds both policies, advances rounds deterministically ----
function makeSim(opts){
  opts=opts||{};
  const seed=opts.seed||7, K=opts.K||8, k=opts.k||5;
  const sigRel=opts.sigma!=null?opts.sigma:0.18;  // noise σ relative to mean
  const BONUS=opts.bonus!=null?opts.bonus:0.4;    // CombUCB exploration multiplier (× σ·mean confidence width)
  const graph=buildGraph(BERLIN,k,seed);
  const E=graph.edges.length;
  // far-apart source/target: leftmost & rightmost nodes
  let src=0,dst=0;for(let i=0;i<graph.n;i++){if(BERLIN[i][0]<BERLIN[src][0])src=i;if(BERLIN[i][0]>BERLIN[dst][0])dst=i;}
  // optimal (true) route + cost — the regret reference
  const opt=dijkstra(graph,graph.mean,src,dst);
  const optCost=opt?opt.cost:1;

  // noise sampler keyed deterministically per (edge, observation count)
  const obsR=rng(seed*97+13);
  const sample=(e)=>clamp(graph.mean[e]+gauss(obsR)*sigRel*graph.mean[e],0,Infinity);

  // ---- CombUCB-on-edges state ----
  const DEFAULT=graph.edges.map(e=>e.len*0.9);  // optimistic small prior so all edges get tried
  const cum=new Array(E).fill(0), cnt=new Array(E).fill(0);
  const meanEst=e=>cnt[e]>0?cum[e]/cnt[e]:DEFAULT[e];
  let combChosen=null;        // last chosen edgesUsed
  let distinctSampled=0;

  // ---- route-as-arm state ----
  const routes=enumerateRoutes(graph,src,dst,K,seed);
  const armTrueCost=routes.map(es=>trueCostOfEdges(graph,es));
  const armN=new Array(routes.length).fill(0), armSum=new Array(routes.length).fill(0);
  let armPulled=0;
  // arm-bandit shares the same noise model: observe TOTAL cost only
  const armR=rng(seed*131+7);
  const armSample=(es)=>{let s=0;for(const e of es)s+=clamp(graph.mean[e]+gauss(armR)*sigRel*graph.mean[e],0,Infinity);return s;};

  let round=0, combRegret=0, armRegret=0;
  const histComb=[], histArm=[];   // cumulative regret history

  // LCB per edge: mean − bonus. The confidence radius is scaled to the edge's
  // own travel-time magnitude × σ (the sub-Gaussian width of its samples), so
  // optimism is meaningful relative to weights that are in the hundreds.
  function combLCB(){const w=new Array(E);for(let e=0;e<E;e++){const n=cnt[e];const scale=BONUS*sigRel*graph.mean[e];const bonus=scale*Math.sqrt(2*Math.log(round+2)/(n+1));w[e]=Math.max(0.01,meanEst(e)-bonus);}return w;}

  function stepComb(){
    const w=combLCB();
    const r=dijkstra(graph,w,src,dst);
    combChosen=r.edgesUsed;
    // true regret of the chosen route
    const tc=trueCostOfEdges(graph,r.edgesUsed);
    combRegret+=(tc-optCost);
    // semi-bandit: observe a noisy sample for EVERY edge on the route
    for(const e of r.edgesUsed){if(cnt[e]===0)distinctSampled++;cum[e]+=sample(e);cnt[e]++;}
    histComb.push(combRegret);
  }

  function stepArm(){
    // UCB1 over routes (we minimize cost -> use lower confidence bound)
    let best=0,bs=Infinity;
    for(let a=0;a<routes.length;a++){
      if(armN[a]===0){best=a;bs=-Infinity;break;}
      const m=armSum[a]/armN[a];
      const lcb=m-BONUS*0.5*optCost*Math.sqrt(2*Math.log(armPulled+1)/armN[a]);
      if(lcb<bs){bs=lcb;best=a;}
    }
    const es=routes[best];
    armRegret+=(armTrueCost[best]-optCost);
    armSum[best]+=armSample(es);armN[best]++;armPulled++;
    histArm.push(armRegret);
  }

  function step(){stepComb();stepArm();round++;}

  // gap = (true cost of CURRENT comb-chosen route − optimal)/optimal
  function gap(){if(!combChosen)return (trueCostOfEdges(graph,enumerateRoutes(graph,src,dst,1,seed)[0])-optCost)/optCost;return (trueCostOfEdges(graph,combChosen)-optCost)/optCost;}
  function armGap(){if(armPulled===0)return 1;let best=0,bm=Infinity;for(let a=0;a<routes.length;a++){if(armN[a]===0)continue;const m=armSum[a]/armN[a];if(m<bm){bm=m;best=a;}}return (armTrueCost[best]-optCost)/optCost;}

  return {
    graph,src,dst,opt,optCost,routes,
    meanEst,cnt,DEFAULT,
    get combChosen(){return combChosen;},
    get round(){return round;},
    get combRegret(){return combRegret;},
    get armRegret(){return armRegret;},
    get distinctSampled(){return distinctSampled;},
    histComb,histArm,
    step,gap,armGap,
    // manual mode: observe a user-built route's edges into CombUCB stats
    observeManual(edgesUsed){for(const e of edgesUsed){if(cnt[e]===0)distinctSampled++;cum[e]+=sample(e);cnt[e]++;}},
    state(){return {round,regret:combRegret,armRegret,gap:gap(),armGap:armGap(),optCost,distinctSampled};},
  };
}

// ============================ MOUNT (DOM) ============================
function mountBerlinPath(root,opts){
  opts=opts||{};
  let seed=opts.seed||7;
  let sim=makeSim({seed,sigma:opts.sigma,bonus:opts.bonus,k:opts.k,K:opts.K});
  let playing=false,raf=null,reveal=false,manual=false,manualPath=[];

  root.classList.add('bp-root');
  root.innerHTML=`<div class="bp-grid">
      <canvas class="bp-map"></canvas>
      <canvas class="bp-chart"></canvas>
    </div>
    <div class="bp-cards">
      <div class="bp-card" style="border-left-color:${COLORS.blue}">
        <div class="n" style="color:${COLORS.blue}">CombUCB · edges</div>
        <div class="row"><span>round</span><b data-f="round">0</b></div>
        <div class="row"><span>edges sampled</span><b data-f="sampled">0</b></div>
        <div class="row"><span>cum. regret</span><b data-f="creg">0</b></div>
      </div>
      <div class="bp-card" style="border-left-color:${COLORS.gold}">
        <div class="n" style="color:${COLORS.gold}">route cost vs optimal</div>
        <div class="row"><span>chosen (true)</span><b data-f="chosen">—</b></div>
        <div class="row"><span>optimal</span><b data-f="opt">—</b></div>
        <div class="row"><span>gap</span><b data-f="gap">—</b></div>
      </div>
      <div class="bp-card" style="border-left-color:${COLORS.orange}">
        <div class="n" style="color:${COLORS.orange}">route-as-arm</div>
        <div class="row"><span>arms (K)</span><b data-f="K">0</b></div>
        <div class="row"><span>cum. regret</span><b data-f="areg">0</b></div>
        <div class="row"><span>arm gap</span><b data-f="agap">—</b></div>
      </div>
    </div>
    <div class="bp-controls">
      <button class="primary" data-f="play">▶ play</button>
      <button data-f="step">+1 round</button>
      <button data-f="step50">+50</button>
      <button data-f="reveal">reveal optimal</button>
      <button data-f="manual">manual route</button>
      <button data-f="drive" style="display:none">drive it</button>
      <button data-f="reset">reset (new congestion)</button>
      <label>noise σ <input type="range" min="0.05" max="0.4" step="0.01" value="0.18" data-f="sig" style="width:80px"></label>
    </div>
    <div class="bp-note" data-f="note">Hidden edge travel times. <b>CombUCB</b> runs Dijkstra on per-edge optimistic estimates and reuses what it learns across routes; the <span style="color:${COLORS.orange}">route-as-arm</span> bandit only sees each route's total — and crawls.</div>`;
  const $=s=>root.querySelector(`[data-f="${s}"]`);
  const map=root.querySelector('.bp-map'), chart=root.querySelector('.bp-chart');

  // map coordinate transform (berlin coords -> canvas)
  let bounds=null;
  function computeBounds(){let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;for(const p of BERLIN){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);}bounds={minx,miny,maxx,maxy};}
  computeBounds();
  function toXY(p,W,H,pad){const{minx,miny,maxx,maxy}=bounds;const sx=(W-2*pad)/(maxx-minx),sy=(H-2*pad)/(maxy-miny),s=Math.min(sx,sy);return [pad+(p[0]-minx)*s,pad+(p[1]-miny)*s];}

  function edgeColor(mean,len){const r=clamp((mean/len-1)/0.6,0,1);const g=Math.round(95+(232-95)*(r));const grn=Math.round(210-(210-108)*r);const b=Math.round(163-(163-108)*r);return `rgb(${g},${grn},${b})`;}

  function drawMap(){
    const dpr=window.devicePixelRatio||1,W=map.clientWidth||520,H=330,pad=18;
    if(map.width!==W*dpr){map.width=W*dpr;map.height=H*dpr;}map.style.height=H+'px';
    const c=map.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    const g=sim.graph;
    const pos=BERLIN.map(p=>toXY(p,W,H,pad));
    // edges: color = mean estimate, thickness = uncertainty
    for(let e=0;e<g.edges.length;e++){const ed=g.edges[e];const m=sim.meanEst(e);
      const unc=1/Math.sqrt(sim.cnt[e]+1);
      c.strokeStyle=sim.cnt[e]>0?edgeColor(m,ed.len):'rgba(120,130,150,.28)';
      c.lineWidth=0.7+3.2*unc;
      c.beginPath();c.moveTo(pos[ed.u][0],pos[ed.u][1]);c.lineTo(pos[ed.v][0],pos[ed.v][1]);c.stroke();}
    // reveal: gold true optimal path
    if(reveal&&sim.opt){c.strokeStyle=COLORS.gold;c.lineWidth=4;c.globalAlpha=.9;c.beginPath();sim.opt.path.forEach((nd,i)=>{const[x,y]=pos[nd];i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();c.globalAlpha=1;}
    // CombUCB chosen path in blue
    if(sim.combChosen){c.strokeStyle=COLORS.blue;c.lineWidth=2.6;c.beginPath();
      let nodes=edgesToNodes(sim.combChosen,sim.src);nodes.forEach((nd,i)=>{const[x,y]=pos[nd];i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();}
    // manual path in purple
    if(manual&&manualPath.length){c.strokeStyle=COLORS.purple;c.lineWidth=2.4;c.setLineDash([5,4]);c.beginPath();manualPath.forEach((nd,i)=>{const[x,y]=pos[nd];i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();c.setLineDash([]);}
    // nodes
    for(let i=0;i<BERLIN.length;i++){const[x,y]=pos[i];c.fillStyle='#6b7690';c.beginPath();c.arc(x,y,2.2,0,7);c.fill();}
    // source / target
    const drawTag=(idx,col,label)=>{const[x,y]=pos[idx];c.fillStyle=col;c.beginPath();c.arc(x,y,5.5,0,7);c.fill();c.fillStyle=COLORS.fg;c.font='11px '+'ui-monospace,monospace';c.fillText(label,x+8,y+4);};
    drawTag(sim.src,COLORS.green,'S');drawTag(sim.dst,COLORS.red,'T');
  }
  function edgesToNodes(edgesUsed,src){const nodes=[src];let cur=src;for(const e of edgesUsed){const ed=sim.graph.edges[e];const nxt=ed.u===cur?ed.v:ed.u;nodes.push(nxt);cur=nxt;}return nodes;}

  function drawChart(){
    const dpr=window.devicePixelRatio||1,W=chart.clientWidth||420,H=330;
    if(chart.width!==W*dpr){chart.width=W*dpr;chart.height=H*dpr;}chart.style.height=H+'px';
    const c=chart.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    const pl=46,pr=12,pt=16,pb=24,pw=W-pl-pr,ph=H-pt-pb;
    const hc=sim.histComb,ha=sim.histArm;
    const ymax=Math.max(1,...ha.slice(-1),...hc.slice(-1),...ha,...hc);
    const xmax=Math.max(hc.length,1);
    c.strokeStyle='rgba(255,255,255,.06)';c.fillStyle=COLORS.dim;c.font='10px ui-monospace,monospace';
    for(let g=0;g<=4;g++){const y=pt+g/4*ph,v=ymax*(1-g/4);c.beginPath();c.moveTo(pl,y);c.lineTo(pl+pw,y);c.stroke();c.fillText(Math.round(v).toString(),4,y+3);}
    c.fillText('cumulative regret  (rounds: '+sim.round+')',pl+2,pt-4);
    const plot=(hist,col)=>{if(hist.length<1)return;c.strokeStyle=col;c.lineWidth=2;c.beginPath();hist.forEach((v,i)=>{const x=pl+(hist.length<2?0:i/(xmax-1)*pw),y=pt+(1-clamp(v/ymax,0,1))*ph;i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();};
    plot(ha,COLORS.orange);plot(hc,COLORS.blue);
    // legend
    c.textAlign='right';c.fillStyle=COLORS.blue;c.fillText('CombUCB '+Math.round(sim.combRegret),W-pr-2,pt+12);
    c.fillStyle=COLORS.orange;c.fillText('route-arm '+Math.round(sim.armRegret),W-pr-2,pt+26);c.textAlign='left';
  }

  function refreshCards(){
    $('round').textContent=sim.round;
    $('sampled').textContent=sim.distinctSampled+'/'+sim.graph.edges.length;
    $('creg').textContent=Math.round(sim.combRegret);
    const chosen=sim.combChosen?trueCostOfEdgesLocal(sim.combChosen):null;
    $('chosen').textContent=chosen?Math.round(chosen):'—';
    $('opt').textContent=Math.round(sim.optCost);
    $('gap').textContent=(sim.gap()*100).toFixed(1)+'%';
    $('K').textContent=sim.routes.length;
    $('areg').textContent=Math.round(sim.armRegret);
    $('agap').textContent=(sim.armGap()*100).toFixed(1)+'%';
  }
  function trueCostOfEdgesLocal(es){let s=0;for(const e of es)s+=sim.graph.mean[e];return s;}

  function redraw(){drawMap();drawChart();refreshCards();}
  function instant(n){for(let i=0;i<n;i++)sim.step();redraw();}

  function loop(){if(!playing)return;for(let k=0;k<2;k++)sim.step();redraw();raf=requestAnimationFrame(loop);}

  $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ pause':'▶ play';if(playing)loop();};
  $('step').onclick=()=>{playing=false;$('play').textContent='▶ play';sim.step();redraw();};
  $('step50').onclick=()=>{playing=false;$('play').textContent='▶ play';instant(50);};
  $('reveal').onclick=()=>{reveal=!reveal;redraw();};
  $('reset').onclick=()=>{playing=false;$('play').textContent='▶ play';seed=(seed*1103515245+12345)&0x7fffffff;sim=makeSim({seed,sigma:curSig,bonus:opts.bonus,k:opts.k,K:opts.K});manualPath=[];redraw();};
  let curSig=0.18;
  $('sig').oninput=e=>{curSig=parseFloat(e.target.value);playing=false;$('play').textContent='▶ play';sim=makeSim({seed,sigma:curSig,bonus:opts.bonus,k:opts.k,K:opts.K});manualPath=[];redraw();};
  $('manual').onclick=()=>{manual=!manual;$('manual').classList.toggle('on',manual);$('drive').style.display=manual?'':'none';manualPath=manual?[sim.src]:[];$('note').innerHTML=manual?'Click adjacent nodes to extend a route from <span style="color:'+COLORS.green+'">S</span>, then <b>drive it</b> to observe those edges\' times.':'Hidden edge travel times.';redraw();};
  $('drive').onclick=()=>{const es=nodesToEdges(manualPath);if(es){sim.observeManual(es);}redraw();};
  function nodesToEdges(nodes){const es=[];for(let i=0;i+1<nodes.length;i++){const a=nodes[i],b=nodes[i+1];const hit=sim.graph.adj[a].find(x=>x.to===b);if(!hit)return null;es.push(hit.e);}return es;}
  map.addEventListener('click',ev=>{
    if(!manual)return;const rect=map.getBoundingClientRect();const W=map.clientWidth||520,H=330,pad=18;
    const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
    let best=-1,bd=1e9;for(let i=0;i<BERLIN.length;i++){const[x,y]=toXY(BERLIN[i],W,H,pad);const d=(x-mx)*(x-mx)+(y-my)*(y-my);if(d<bd){bd=d;best=i;}}
    if(best<0||bd>400)return;const last=manualPath[manualPath.length-1];
    if(sim.graph.adj[last]&&sim.graph.adj[last].some(x=>x.to===best))manualPath.push(best);
    redraw();
  });
  window.addEventListener('resize',redraw);
  redraw();
  return {api:{instant,reset:(s)=>{seed=s||seed;sim=makeSim({seed,sigma:curSig,bonus:opts.bonus,k:opts.k,K:opts.K});manualPath=[];redraw();},state:()=>sim.state()}};
}
window.__component={name:'path/berlin-path',mount:mountBerlinPath};
if(typeof document!=='undefined'){const st=document.getElementById('stage');if(st)mountBerlinPath(st,{});}
</script>
