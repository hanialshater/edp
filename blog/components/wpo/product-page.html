<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>component · wpo/product-page</title>
<!--
  COMPONENT SPEC
  Renders a REAL styled e-commerce PDP (phone-width frame) from an ordered list
  of EDP module names. Ported from wpo-widgets/widget-renderers.js — 22 widget
  renderers keyed by module name, the BOSS tuxedo PRODUCT fixture, inline SVG
  garment atoms, the tile()/widgetChrome() helpers and the COL accent palette.
  All classes prefixed `wpo-` to avoid collisions. Fully offline (no fonts /
  images / CDN / fetch). Light "phone screen" card on the dark blog page.
-->
<style>
:root{--bg:#0b1220;--card:#131c30;--fg:#e6edf3;--dim:#8b95a8;--border:#1f2a44;--mono:ui-monospace,Menlo,Monaco,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{padding:24px 16px 80px}
.harness{max-width:860px;margin:0 auto}
.harness h1{font-size:18px;font-family:var(--mono);color:var(--dim);font-weight:600}

/* ── component root (dark) ─────────────────────────────────────────── */
.wpo-root{display:flex;flex-direction:column;align-items:center;gap:8px}
.wpo-toolbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:4px}
.wpo-toolbar button{font-family:var(--mono);font-size:11px;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px 11px;cursor:pointer}
.wpo-toolbar button:hover{border-color:#4c8df6}
.wpo-toolbar button.on{background:#4c8df6;color:#0b1220;border-color:#4c8df6;font-weight:600}

/* phone screen — light retail surface on the dark page */
.wpo-phone{width:390px;max-width:100%;flex:0 0 auto;background:#0f172a;border:1px solid #243043;border-radius:26px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.wpo-phone__notch{height:18px;display:flex;align-items:center;justify-content:center}
.wpo-phone__notch::before{content:"";width:90px;height:5px;border-radius:3px;background:#243043}
.wpo-screen{background:#f0eee9;border-radius:20px;overflow:hidden;color:#0c0c10;font-family:'Inter Tight',-apple-system,system-ui,sans-serif}
.wpo-shell{padding:10px 10px 16px;display:flex;flex-direction:column;gap:10px}

/* product header / hero */
.wpo-hero{background:#fff;border:1px solid #ececea;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.wpo-hero__img{aspect-ratio:21/12;background:#f1efe9;border-radius:4px;display:flex;align-items:center;justify-content:center}
.wpo-hero__img>div{width:24%;height:88%}
.wpo-hero__crumbs{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#9a9a9a;text-transform:uppercase}
.wpo-hero__brand{font-size:10px;font-weight:700;letter-spacing:.18em;color:#55555f}
.wpo-hero__name{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 0}
.wpo-hero__rating{font-size:11px;color:#55555f}
.wpo-hero__rating b{color:#0c0c10}
.wpo-hero__price{font-size:18px;font-weight:700}
.wpo-hero__sizes{display:flex;gap:4px;flex-wrap:wrap}
.wpo-hero__size{padding:5px 9px;font-size:11px;font-weight:600;border:1px solid #d8d8d3;border-radius:2px;background:#fff;color:#0c0c10;cursor:pointer}
.wpo-hero__size--on{background:#0c0c10;color:#fff;border-color:#0c0c10}
.wpo-hero__cta{display:flex;gap:6px}
.wpo-hero__cta button{flex:1;padding:10px;font-size:12px;font-weight:700;background:#0c0c10;color:#fff;border:none;border-radius:2px;cursor:pointer;font-family:inherit}

/* slot caption above each widget */
.wpo-slot{position:relative;padding-top:9px}
.wpo-slot__chip{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:5px;display:flex;gap:6px;align-items:center}
.wpo-slot__chip b{color:#0f766e}
.wpo-slot__n{background:#0c0c10;color:#fff;border-radius:3px;padding:1px 5px;font-size:8px}

/* ── card chrome (ported .lp-card → .wpo-card) ─────────────────────── */
.wpo-card{background:#fff;border:1px solid #ececea;border-left-width:3px;border-radius:4px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;animation:wpoPop .35s cubic-bezier(.4,0,.2,1) backwards}
@keyframes wpoPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.wpo-card__head{display:flex;flex-direction:column;gap:4px}
.wpo-card__tags{display:flex;gap:5px;align-items:center}
.wpo-tag{padding:2px 6px;border-radius:2px;font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.1em}
.wpo-card__title{font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0;color:#0c0c10}
.wpo-card__body{display:flex;flex-direction:column;gap:7px}
.wpo-card__footer{padding-top:9px;border-top:1px solid #ececea;display:flex;justify-content:space-between;align-items:center}
.wpo-p{font-size:10.5px;line-height:1.4;color:#55555f;margin:0}
.wpo-btn-primary{padding:7px 11px;font-size:10.5px;font-weight:700;background:#0c0c10;color:#fff;border:none;border-radius:2px;cursor:pointer;font-family:inherit}
.wpo-btn-ghost{padding:6px 9px;font-size:10px;font-weight:600;background:#fafaf7;color:#0c0c10;border:1px solid #d8d8d3;border-radius:2px;cursor:pointer;font-family:inherit;align-self:flex-start}
.wpo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wpo-row--5,.wpo-row--6{grid-template-columns:repeat(3,1fr)}

/* fit */
.wpo-fit-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}
.wpo-fit-stat__num{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em;color:#0c5a66}
.wpo-fit-stat__lab{font-size:9.5px;font-weight:600;color:#55555f;line-height:1.3;margin-top:4px}
.wpo-fit-bar{display:flex;height:24px;border-radius:3px;overflow:hidden}
.wpo-fit-bar__seg{position:relative}
.wpo-fit-bar__pct{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:700;color:#fff;letter-spacing:.04em}

/* size */
.wpo-sz-tbl{border:1px solid #ececea;border-radius:3px;overflow:hidden}
.wpo-sz-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:6px 10px;font-size:11px;align-items:center}
.wpo-sz-row+.wpo-sz-row{border-top:1px solid #f1f1ee}
.wpo-sz-row--head{background:#fafaf7;font-size:9px;letter-spacing:.12em;font-weight:600;color:#9a9a9a}
.wpo-sz-row--active{background:#e8f6f9;font-weight:600;color:#0c5a66}

/* alt cards */
.wpo-alt-card{background:#fafaf7;border-radius:3px;padding:7px}
.wpo-alt-card__rate{font-size:9px;font-weight:700;color:#0c5a66;letter-spacing:.08em;margin-top:5px}
.wpo-alt-card__name{font-size:11px;font-weight:600;color:#0c0c10;margin-top:2px}
.wpo-alt-card__price{font-size:11px;color:#55555f;margin-top:2px}

/* comparison */
.wpo-cmp-tbl{border:1px solid #ececea;border-radius:3px;overflow:hidden}
.wpo-cmp-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;padding:6px 8px;font-size:10.5px;align-items:center}
.wpo-cmp-row+.wpo-cmp-row{border-top:1px solid #f1f1ee}
.wpo-cmp-row--head{background:#fafaf7;align-items:flex-start;font-size:9.5px;padding:8px}
.wpo-cmp-row--head b{font-weight:600}
.wpo-cmp-row span:first-child{color:#9a9a9a;font-size:9.5px;letter-spacing:.04em}
.wpo-cmp-pill{display:inline-block;margin-top:4px;padding:1px 4px;font-size:8px;font-weight:700;letter-spacing:.1em;border-radius:2px;background:#0c5234;color:#fff}

/* vs */
.wpo-vs-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.wpo-vs-card{display:flex;align-items:center;gap:6px;padding:6px;background:#fafaf7;border-radius:3px}
.wpo-vs-card--this{background:#e3f3ea;border:1px solid #bcdfc8}
.wpo-vs-card__name{font-size:11px;font-weight:600}
.wpo-vs-card__price{font-size:11px;color:#55555f}
.wpo-vs-card__pct{font-size:9px;font-weight:700;color:#0c5234;letter-spacing:.08em;margin-top:4px}
.wpo-vs-card:not(.wpo-vs-card--this) .wpo-vs-card__pct{color:#9a9a9a}
.wpo-vs-mid{font-size:11px;font-weight:600;color:#9a9a9a}

/* value breakdown */
.wpo-vb-stack{display:flex;flex-direction:column;gap:5px}
.wpo-vb-row{display:grid;grid-template-columns:45% 1fr auto;gap:8px;align-items:center;padding:2px 0;font-size:10.5px}
.wpo-vb-row__bar{height:10px;border-radius:2px}
.wpo-vb-row__lab{color:#0c0c10}
.wpo-vb-row__amt{font-weight:600}
.wpo-vb-foot{padding-top:8px;margin-top:4px;border-top:1px solid #ececea;font-size:11px;color:#55555f}
.wpo-vb-foot b{color:#0c5234;font-weight:700}

/* outfit completion */
.wpo-oc-lay{position:relative;aspect-ratio:16/9;background:#f4f1ea;border-radius:4px;overflow:hidden}
.wpo-oc-item{position:absolute;transform-origin:center}
.wpo-oc-item>div{width:100%!important;height:100%!important;box-shadow:0 6px 18px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05)}
.wpo-oc-list{display:grid;grid-template-columns:1fr;gap:3px}
.wpo-oc-row{display:flex;align-items:center;gap:6px;padding:4px 7px;background:#fafaf7;border-radius:2px;font-size:10.5px}
.wpo-oc-num{width:14px;height:14px;background:#0c0c10;color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;flex:0 0 auto}
.wpo-oc-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#0c0c10}
.wpo-oc-price{font-weight:600;flex:0 0 auto}
.wpo-oc-foot{display:flex;justify-content:space-between;align-items:center;width:100%}
.wpo-oc-foot>span{font-size:11px;color:#55555f}

/* style bridge */
.wpo-sb-tabs{display:flex;gap:3px;flex-wrap:wrap}
.wpo-sb-tab{padding:5px 10px;font-size:10.5px;font-weight:500;background:#fafaf7;color:#55555f;border:none;border-radius:100px;cursor:pointer;font-family:inherit}
.wpo-sb-tab--on{background:#0c0c10;color:#fff;font-weight:600}
.wpo-sb-row{display:grid;grid-template-columns:100px 1fr;gap:10px}
.wpo-sb-hero{aspect-ratio:4/5}
.wpo-sb-items{display:flex;flex-direction:column}
.wpo-sb-item{display:grid;grid-template-columns:18px 30px 1fr auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #ececea;font-size:10.5px}
.wpo-sb-item__num{font-size:9.5px;font-weight:700;color:#c9764a}
.wpo-sb-item__name{font-weight:600}
.wpo-sb-item__why{font-size:9.5px;color:#9a9a9a;margin-top:2px}
.wpo-sb-item__price{font-weight:600}

/* occasion lookbook */
.wpo-ob-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.wpo-ob-card{position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;padding:8px;color:#fff;cursor:pointer}
.wpo-ob-card__num{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.6)}
.wpo-ob-card__man{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:70%;height:72%;opacity:.85}
.wpo-ob-card__lab{position:absolute;bottom:8px;left:8px;right:8px;font-size:11px;font-weight:600}

/* return explainer */
.wpo-re-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.wpo-re-step{position:relative;background:#fafaf7;padding:10px;border-radius:3px}
.wpo-re-step__num{width:22px;height:22px;border-radius:50%;background:#7a1c2a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;margin-bottom:7px}
.wpo-re-step__t{font-size:11px;font-weight:600;color:#0c0c10}
.wpo-re-step__d{font-size:10px;color:#55555f;margin-top:3px}
.wpo-re-step__line{display:none}

/* easy returns */
.wpo-erp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wpo-erp-stat{padding:10px;background:#fbe3e6;border-radius:3px;text-align:center}
.wpo-erp-stat__big{font-size:22px;font-weight:700;color:#7a1c2a;letter-spacing:-.02em;line-height:1}
.wpo-erp-stat__lab{font-size:8.5px;letter-spacing:.16em;font-weight:600;color:#55555f;margin-top:5px}

/* brand story */
.wpo-bs-row{display:grid;grid-template-columns:90px 1fr;gap:10px}
.wpo-bs-img{aspect-ratio:3/4}
.wpo-bs-marks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.wpo-bs-mark{padding:6px;background:#fbf2dd;border-radius:3px}
.wpo-bs-mark__year{display:block;font-size:14px;font-weight:700;color:#7a4e0a;letter-spacing:-.01em}
.wpo-bs-mark__lab{display:block;font-size:8.5px;letter-spacing:.14em;font-weight:600;color:#55555f;margin-top:3px}

/* material deep dive */
.wpo-md-row{display:grid;grid-template-columns:80px 1fr;gap:10px}
.wpo-md-fabric{aspect-ratio:1}
.wpo-md-meta{display:flex;flex-direction:column}
.wpo-md-prop{display:grid;grid-template-columns:60px 1fr;padding:5px 0;border-bottom:1px solid #ececea;font-size:11px}
.wpo-md-prop__lab{font-size:9px;letter-spacing:.12em;font-weight:600;color:#9a9a9a;text-transform:uppercase;align-self:center}
.wpo-md-prop__val{color:#0c0c10;font-weight:500}

/* price history */
.wpo-ph-chart{background:#fbeadc;padding:10px;border-radius:3px}
.wpo-ph-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:#7a3c0d;margin-top:4px;padding:0 4px}
.wpo-ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wpo-ph-stats>div{padding:7px;background:#fafaf7;border-radius:3px;display:flex;flex-direction:column;gap:3px}
.wpo-ph-stat__lab{font-size:8.5px;letter-spacing:.14em;font-weight:600;color:#9a9a9a}
.wpo-ph-stat__val{font-size:14px;font-weight:700;color:#0c0c10}

/* price drop */
.wpo-pd-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wpo-pd-target{flex:1 1 auto}
.wpo-pd-target__lab{display:block;font-size:9px;letter-spacing:.12em;font-weight:600;color:#9a9a9a;text-transform:uppercase;margin-bottom:6px}
.wpo-pd-target__pill{display:inline-flex;align-items:baseline;gap:4px;padding:7px 11px;background:#fbeadc;border-radius:100px;font-size:13px;font-weight:700;color:#7a3c0d}
.wpo-pd-target__amt{font-size:17px}
.wpo-pd-target__edit{font-size:10px;font-weight:500;color:#c9764a;text-decoration:underline;cursor:pointer;margin-left:6px}

/* recently viewed */
.wpo-rv-card{background:#fafaf7;padding:6px;border-radius:3px}
.wpo-rv-card__name{font-size:11px;font-weight:600;margin-top:5px}
.wpo-rv-card__row{display:flex;justify-content:space-between;font-size:10px;margin-top:2px;color:#55555f}
.wpo-rv-card__when{font-family:var(--mono);font-size:8.5px}

/* wishlist */
.wpo-ws-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:4px 0}
.wpo-ws-row .wpo-btn-ghost{grid-column:1/-1;align-self:stretch;text-align:center}
.wpo-ws-heart{width:36px;height:36px;background:#e8e9f7;border-radius:50%;display:flex;align-items:center;justify-content:center}
.wpo-ws-title{font-size:12px;font-weight:600;color:#0c0c10}
.wpo-ws-sub{font-size:10.5px;color:#55555f;margin-top:3px}

/* expert pick */
.wpo-ep-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:flex-start}
.wpo-ep-portrait{width:42px;height:42px;border-radius:50%;background:#e8e9f7;display:flex;align-items:center;justify-content:center}
.wpo-ep-portrait__inner{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#26307a,#5a64a8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.wpo-ep-quote{font-size:11.5px;line-height:1.5;color:#0c0c10;font-style:italic}
.wpo-ep-author{font-size:10px;color:#9a9a9a;margin-top:6px}

/* similar / also / trending / personal */
.wpo-si-card{padding:4px}
.wpo-si-card__name{font-size:10.5px;font-weight:600;margin-top:5px}
.wpo-si-card__price{font-size:10.5px;color:#55555f;margin-top:2px}
.wpo-si-card__trend{font-family:var(--mono);font-size:8.5px;font-weight:700;color:#7a4e0a;letter-spacing:.04em;margin-top:4px}
</style>
</head>
<body>
<div class="harness">
  <h1>component · wpo/product-page</h1>
  <div id="stage"></div>
</div>
<script>
// ─── PRODUCT FIXTURE (ported) ──────────────────────────────────────────────
const PRODUCT={brand:'BOSS',name:'Slim-Fit Black Wool Tuxedo',price:895,
  sizes:['38','40','42','44','46','48'],selectedSize:'42',rating:4.7,reviews:284,
  returnRate:4,category:'Suits & Tuxedos'};

// ─── SVG GARMENT ATOMS (ported) ────────────────────────────────────────────
const SVG={
  tuxedo:()=>`<svg viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
    <path d="M70 165 L65 268 L92 268 L100 175 L108 268 L135 268 L130 165Z" fill="#15151a"/>
    <path d="M55 80 Q55 70 75 65 L125 65 Q145 70 145 80 L148 170 L130 175 L100 165 L70 175 L52 170Z" fill="#1a1a1f"/>
    <path d="M75 65 L95 75 L90 150 L100 165 L100 90Z" fill="#0c0c10"/>
    <path d="M125 65 L105 75 L110 150 L100 165 L100 90Z" fill="#0c0c10"/>

    <path d="M88 80 L100 86 L100 92 L88 98Z M112 80 L100 86 L100 92 L112 98Z" fill="#0a0a0d"/>
    <rect x="98" y="84" width="4" height="10" fill="#0a0a0d"/></svg>`,
  bow:()=>`<svg viewBox="0 0 200 130" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
    <path d="M30 50 Q35 45 45 47 L90 70 L90 90 L45 113 Q35 115 30 110Z" fill="#1a1a1f"/>
    <path d="M170 50 Q165 45 155 47 L110 70 L110 90 L155 113 Q165 115 170 110Z" fill="#1a1a1f"/>
    <rect x="88" y="67" width="24" height="26" rx="2" fill="#0a0a0d"/></svg>`,
  shoe:()=>`<svg viewBox="0 0 240 160" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
    <path d="M30 120 Q25 130 35 132 L210 132 Q225 130 215 118Z" fill="#0a0a0d"/>
    <path d="M35 118 Q30 90 50 78 Q90 60 140 65 Q200 72 215 100 Q218 115 210 122 L40 122 Q32 122 35 118Z" fill="#1a1a1f"/>
    <path d="M50 85 Q90 72 150 75 Q195 80 205 95" stroke="#3a3a45" stroke-width="2" fill="none" opacity=".7"/>
    <path d="M95 95 L95 118 L140 118 L145 95Z" fill="#0a0a0d"/></svg>`,
  shirt:()=>`<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
    <path d="M50 60 L30 90 L35 200 L65 195 L70 75Z" fill="#fafaf7" stroke="#e0e0d8" stroke-width=".6"/>
    <path d="M150 60 L170 90 L165 200 L135 195 L130 75Z" fill="#fafaf7" stroke="#e0e0d8" stroke-width=".6"/>
    <path d="M65 55 Q65 50 75 50 L125 50 Q135 50 135 55 L138 240 L62 240Z" fill="#fff" stroke="#e0e0d8" stroke-width=".6"/>
    <path d="M75 50 L95 40 L100 55 L105 40 L125 50 L122 65 L100 58 L78 65Z" fill="#fff" stroke="#d0d0c8" stroke-width=".6"/>
    <line x1="100" y1="58" x2="100" y2="240" stroke="#e0e0d8" stroke-width=".8"/></svg>`,
  cufflinks:()=>`<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
    <circle cx="65" cy="95" r="22" fill="#1a1a1f"/><circle cx="65" cy="95" r="17" fill="#0a0a0d"/>
    <circle cx="60" cy="90" r="4" fill="#3a3a3f" opacity=".6"/>
    <circle cx="135" cy="105" r="22" fill="#1a1a1f"/><circle cx="135" cy="105" r="17" fill="#0a0a0d"/>
    <circle cx="130" cy="100" r="4" fill="#3a3a3f" opacity=".6"/></svg>`,
  cummerbund:()=>`<svg viewBox="0 0 240 140" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">

  wishlist_save:()=>widgetChrome('indigo','Not sure yet? Save it','WISHLIST · F51',

       <div class="wpo-ws-body"><div class="wpo-ws-title">Sleep on it — we'll remember the size.</div><div class="wpo-ws-sub">Wishlist items average 4 days to purchase. 71% come back.</div></div>

       ${[{name:'Reiss Mercer',price:595},{name:'Sandro Peak',price:720},{name:'Tiger Stockholm',price:825},{name:'Sandro Bordeaux',price:645},{name:'Reiss Halton',price:540},{name:'COS Velvet',price:380}].map(it=>`

// fallback for unknown/unmapped module names
const fallback=(name)=>widgetChrome('slate',
  name.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),'MODULE',
  `<p class="wpo-p">No renderer mapped for <b>${name}</b>. This is a defensive placeholder in the product-page component.</p>`);

const ALL_MODULES=Object.keys(R);
const DEFAULT_PAGE=['fit_reassurance','size_guide','comparison_card','value_breakdown','return_explainer','similar_items'];

// ─── HEADER / HERO ─────────────────────────────────────────────────────────
function heroHTML(){
  return `<div class="wpo-hero">
    <div class="wpo-hero__crumbs">${PRODUCT.category}</div>
    <div class="wpo-hero__img"><div>${SVG.tuxedo()}</div></div>
    <div class="wpo-hero__brand">${PRODUCT.brand}</div>
    <h2 class="wpo-hero__name">${PRODUCT.name}</h2>
    <div class="wpo-hero__rating">★ <b>${PRODUCT.rating}</b> · ${PRODUCT.reviews} reviews · ${PRODUCT.returnRate}% return rate</div>
    <div class="wpo-hero__price">€${PRODUCT.price}</div>
    <div class="wpo-hero__sizes">${PRODUCT.sizes.map(s=>`<span class="wpo-hero__size ${s===PRODUCT.selectedSize?'wpo-hero__size--on':''}">${s}</span>`).join('')}</div>
    <div class="wpo-hero__cta"><button>Add to bag — €${PRODUCT.price}</button></div>
  </div>`;
}

// ─── MOUNT ─────────────────────────────────────────────────────────────────
function mountWpoPage(root,opts){
  opts=opts||{};
  let page=Array.isArray(opts.page)&&opts.page.length?opts.page.slice():DEFAULT_PAGE.slice();
  let rendered=[];

  root.classList.add('wpo-root');

  function render(){
    rendered=[];
    const slots=page.map((name,i)=>{
      const fn=R[name];
      rendered.push(name);
      const cardHTML=fn?fn():fallback(name);
      const known=!!fn;
      return `<div class="wpo-slot">
        <div class="wpo-slot__chip"><span class="wpo-slot__n">${i+1}</span><b>${name}</b>${known?'':' · unmapped'}</div>
        ${cardHTML}
      </div>`;
    }).join('');
    root.innerHTML=`
      <div class="wpo-toolbar">
        <button data-f="essentials">essentials</button>
        <button data-f="premium">premium</button>
        <button data-f="discovery">discovery</button>
        <button data-f="all">all 22</button>
      </div>
      <div class="wpo-phone">
        <div class="wpo-phone__notch"></div>
        <div class="wpo-screen">
          <div class="wpo-shell">
            ${heroHTML()}
            ${slots}
          </div>
        </div>
      </div>`;
    const presets={
      essentials:DEFAULT_PAGE,
      premium:['brand_story','material_deep_dive','value_breakdown','expert_pick','price_history','occasion_lookbook'],
      discovery:['recently_viewed','similar_items','also_bought','trending_now','personal_recs','wishlist_save'],
      all:ALL_MODULES,
    };
    Object.keys(presets).forEach(k=>{
      const b=root.querySelector(`[data-f="${k}"]`);
      if(b)b.onclick=()=>setPage(presets[k]);
    });
  }

  function setPage(names){
    page=Array.isArray(names)&&names.length?names.slice():DEFAULT_PAGE.slice();
    render();
  }

  render();

  return {api:{
    setPage,
    instant(){/* no-op: this component has no time-stepped sim */},
    state:()=>({count:rendered.length,rendered:rendered.slice()}),
  }};
}

window.__component={name:'wpo/product-page',mount:mountWpoPage};
if(typeof document!=='undefined'){const st=document.getElementById('stage');if(st)mountWpoPage(st,{});}
</script>
