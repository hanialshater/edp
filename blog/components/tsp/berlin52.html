<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>component · berlin52 tour explorer</title>
<!--
  COMPONENT SPEC
  Shows: berlin52 (TSPLIB) on a map, edge distances HIDDEN until traversed.
         Three policies race to a short tour on ONE chart (true cost vs round):
         random tours / 2-opt on running estimates / CombUCB (2-opt on LCB).
  Feel:  "n! tours is hopeless, but distances are shared across tours — spend
         an observation budget on edges and 2-opt-on-LCB lands within a few %
         of the known optimum 7542, escaping the factorial."
  Knob:  policy selector (which tour is drawn) + manual tour building.
-->
<style>
:root{--bg:#0b1220;--card:#131c30;--card2:#1a2440;--fg:#e6edf3;--dim:#8b95a8;--accent:#4c8df6;--accent2:#2a4a7a;--good:#5fd2a3;--warn:#f0a058;--bad:#e16c6c;--purple:#c879f0;--border:#1f2a44;--code:#0e1626;--mono:ui-monospace,Menlo,Monaco,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{padding:24px 16px 80px}
.harness{max-width:860px;margin:0 auto}
.harness h1{font-size:18px;font-family:var(--mono);color:var(--dim);font-weight:600}
.bl-root{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--fg)}
.bl-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:600px){.bl-cards{grid-template-columns:repeat(2,1fr)}}
.bl-card{background:var(--code);border:1px solid var(--border);border-left-width:3px;border-radius:8px;padding:8px 10px}
.bl-card .n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--dim)}
.bl-card .v{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--fg);margin-top:3px}
.bl-card .s{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.bl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.bl-grid{grid-template-columns:1fr}}
.bl-map{display:block;width:100%;height:300px;background:var(--code);border:1px solid var(--border);border-radius:8px;cursor:crosshair}
.bl-chart{display:block;width:100%;height:300px;background:var(--code);border:1px solid var(--border);border-radius:8px}
.bl-controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}
.bl-controls button{font-family:var(--mono);font-size:12.5px;background:var(--card2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 12px;cursor:pointer}
.bl-controls button:hover{background:var(--accent2);border-color:var(--accent)}
.bl-controls button.primary{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:600}
.bl-controls select{font-family:var(--mono);font-size:12px;background:var(--card2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
.bl-controls label{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
.bl-note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5}
.bl-note b{color:var(--good)}
.bl-leg{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px}
.bl-leg i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
</style>
</head>
<body>
<div class="harness">
  <h1>component · tsp/berlin52</h1>
  <div id="stage"></div>
</div>
<script>
// =================== PURE LOGIC (no DOM) ===================
const COLORS={blue:'#4c8df6',green:'#5fd2a3',orange:'#f0a058',purple:'#c879f0',red:'#e16c6c',dim:'#8b95a8',fg:'#e6edf3'};
const OPT=7542; // known optimal tour length for berlin52
const BERLIN=[[565,575],[25,185],[345,750],[945,685],[845,655],[880,660],[25,230],[525,1000],[580,1175],[650,1130],[1605,620],[1220,580],[1465,200],[1530,5],[845,680],[725,370],[145,665],[415,635],[510,875],[560,365],[300,465],[520,585],[480,415],[835,625],[975,580],[1215,245],[1320,315],[1250,400],[660,180],[410,250],[420,555],[575,665],[1150,1160],[700,580],[685,595],[685,610],[770,610],[795,645],[720,635],[760,650],[475,960],[95,260],[875,920],[700,500],[555,815],[830,485],[1170,65],[830,610],[605,625],[595,360],[1340,725],[1740,245]];
const N=BERLIN.length; // 52

function rng(seed){let s=seed|0||1;return function(){s=(s+0x6D2B79F5)|0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(rand){const u=rand()||1e-12,v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

// true Euclidean (EUC_2D) distance matrix
function buildTrue(){
  const D=Array.from({length:N},()=>new Float64Array(N));
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const dx=BERLIN[i][0]-BERLIN[j][0],dy=BERLIN[i][1]-BERLIN[j][1];
    const d=Math.sqrt(dx*dx+dy*dy);D[i][j]=d;D[j][i]=d;
  }return D;
}
const TRUE=buildTrue();
const NEDGES=N*(N-1)/2; // 1326
const GLOBAL_MEAN=(function(){let s=0;for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)s+=TRUE[i][j];return s/NEDGES;})();

function tourCost(tour,D){let c=0;for(let k=0;k<tour.length;k++)c+=D[tour[k]][tour[(k+1)%tour.length]];return c;}
function randomTour(rand){const t=[...Array(N).keys()];for(let i=N-1;i>0;i--){const k=(rand()*(i+1))|0;[t[i],t[k]]=[t[k],t[i]];}return t;}

// nearest-neighbour construction on a cost matrix C (estimated/optimistic)
function nearestNeighbour(C,start){
  const used=new Uint8Array(N),tour=[start];used[start]=1;let cur=start;
  for(let s=1;s<N;s++){let bn=-1,bd=Infinity;for(let j=0;j<N;j++)if(!used[j]&&C[cur][j]<bd){bd=C[cur][j];bn=j;}tour.push(bn);used[bn]=1;cur=bn;}
  return tour;
}
// bounded 2-opt on cost matrix C: at most `maxPasses` sweeps, stops when no improvement
function twoOpt(tour,C,maxPasses){
  tour=tour.slice();const n=tour.length;
  for(let pass=0;pass<maxPasses;pass++){
    let improved=false;
    for(let i=0;i<n-1;i++){
      const a=tour[i],b=tour[i+1];
      for(let k=i+2;k<n;k++){
        const c=tour[k],d=tour[(k+1)%n];
        if(a===d)continue;
        const delta=(C[a][c]+C[b][d])-(C[a][b]+C[c][d]);
        if(delta<-1e-9){ // reverse segment i+1..k
          let lo=i+1,hi=k;while(lo<hi){const tmp=tour[lo];tour[lo]=tour[hi];tour[hi]=tmp;lo++;hi--;}
          improved=true;
        }
      }
    }
    if(!improved)break;
  }
  return tour;
}

// Per-edge belief store: running mean + visit count, indexed by i<j.
function makeBeliefs(){
  const mean=new Float64Array(NEDGES),cnt=new Int32Array(NEDGES);
  return {mean,cnt};
}
function eidx(i,j){if(i>j){const t=i;i=j;j=t;}return i*N-((i*(i+1))>>1)+(j-i-1);} // unique index for i<j
function observe(bel,i,j,sample){const e=eidx(i,j);const c=bel.cnt[e];bel.mean[e]=(bel.mean[e]*c+sample)/(c+1);bel.cnt[e]=c+1;}
// build estimated cost matrix (mean, default=global mean when unseen)
function estMatrix(bel){
  const C=Array.from({length:N},()=>new Float64Array(N));
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const e=eidx(i,j);const v=bel.cnt[e]>0?bel.mean[e]:GLOBAL_MEAN;C[i][j]=v;C[j][i]=v;}
  return C;
}
// LCB cost matrix: mean - bonus*sqrt(log(t+1)/n). Unseen edges get an optimistic (low) cost.
function lcbMatrix(bel,t,bonus){
  const lg=Math.log(t+2);
  const C=Array.from({length:N},()=>new Float64Array(N));
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const e=eidx(i,j),n=bel.cnt[e];
    let v;
    if(n>0)v=Math.max(0,bel.mean[e]-bonus*GLOBAL_MEAN*Math.sqrt(lg/n));
    else v=Math.max(0,GLOBAL_MEAN-bonus*GLOBAL_MEAN*Math.sqrt(lg)); // very optimistic for unseen
    C[i][j]=v;C[j][i]=v;
  }
  return C;
}
// noisy observation of a true edge: Gaussian with sigma proportional to mean, clamped >=0
function noisy(i,j,rand,noise){const m=TRUE[i][j];return Math.max(0,m+gauss(rand)*noise*m);}

// One round for a policy. Two phases, the standard bandit split:
//   EXPLORE  — traverse a tour to gather noisy per-edge samples. The ucb policy
//              traverses an OPTIMISTIC (LCB) tour so it probes under-sampled
//              edges; the estimate policy just 2-opts on its current means.
//   EXPLOIT  — the tour we *recommend* (and score on TRUE distances) is the
//              greedy 2-opt on the current MEAN estimates, warm-started from the
//              last recommendation. Exploration tours are deliberately bad; the
//              recommended tour is what converges toward the optimum.
// Carrying both incumbents lets a tiny per-round observation budget accumulate
// into a near-optimal tour — escaping the n! tour space via shared edges.
function policyRound(pol,st){
  let tour;
  if(pol==='random'){
    tour=randomTour(st.rand);
  }else{
    const C=pol==='ucb'?lcbMatrix(st.bel,st.t,st.bonus):estMatrix(st.bel);
    let seed=(st.incumbent && st.t%5!==0)?st.incumbent:nearestNeighbour(C,(st.rand()*N)|0);
    tour=twoOpt(seed,C,st.passes);
    st.incumbent=tour;
  }
  // traverse: observe each edge along the explored tour with a noisy sample
  for(let k=0;k<tour.length;k++){const a=tour[k],b=tour[(k+1)%tour.length];observe(st.bel,a,b,noisy(a,b,st.rand,st.noise));}
  st.t++;
  // EXPLOIT: best recommended tour = 2-opt on the MEAN matrix (point estimates),
  // warm-started from the previous recommendation. Score it on TRUE distances.
  let rec;
  if(pol==='random'){ rec=tour; } // random baseline: just score what it traversed
  else{
    const M=estMatrix(st.bel);
    // refine the standing recommendation; periodically also try a fresh NN seed
    // on the latest means and keep whichever 2-opt result is cheaper (on means).
    const warm=st.recTour?twoOpt(st.recTour,M,st.passes):null;
    let rec2=warm;
    if(!warm || st.t%7===0){
      const fresh=twoOpt(nearestNeighbour(M,(st.rand()*N)|0),M,st.passes);
      if(!rec2 || tourCost(fresh,M)<tourCost(rec2,M)) rec2=fresh;
    }
    rec=rec2; st.recTour=rec;
  }
  const cost=tourCost(rec,TRUE);
  if(cost<st.best){st.best=cost;st.bestTour=rec.slice();}
  return {tour,cost};
}

// Strong reference tour on TRUE distances (multi-restart 2-opt) — approximates 7542.
function bestKnown(rand,restarts){
  let best=null,bc=Infinity;
  for(let r=0;r<restarts;r++){
    const seed=nearestNeighbour(TRUE,(rand()*N)|0);
    const t=twoOpt(seed,TRUE,30);
    const c=tourCost(t,TRUE);
    if(c<bc){bc=c;best=t;}
  }
  return {tour:best,cost:bc};
}

// =================== MOUNT ===================
function mountBerlin52(root,opts){
  opts=opts||{};
  const POLICIES=[
    {key:'random',label:'random tours',color:COLORS.dim},
    {key:'estimate',label:'2-opt on estimates',color:COLORS.orange},
    {key:'ucb',label:'CombUCB (2-opt on LCB)',color:COLORS.green},
  ];
  const NOISE=opts.noise!=null?opts.noise:0.35;
  const BONUS=opts.bonus!=null?opts.bonus:0.9;
  const PASSES=opts.passes!=null?opts.passes:10; // bounded 2-opt sweeps (cap)
  let seed=opts.seed||7;
  let runs, drawKey='ucb', playing=false, raf=null, ref=null, manual=null;

  root.classList.add('bl-root');
  root.innerHTML=`<div class="bl-cards">
      <div class="bl-card" style="border-left-color:var(--accent)"><div class="n">tours run</div><div class="v" data-f="tours">0</div><div class="s">rounds / policy</div></div>
      <div class="bl-card" style="border-left-color:var(--good)"><div class="n">best tour (true)</div><div class="v" data-f="best">—</div><div class="s">selected policy</div></div>
      <div class="bl-card" style="border-left-color:var(--warn)"><div class="n">% over optimal</div><div class="v" data-f="gap">—</div><div class="s">opt = 7542</div></div>
      <div class="bl-card" style="border-left-color:var(--purple)"><div class="n">edges observed</div><div class="v" data-f="edges">0</div><div class="s">of 1326 possible</div></div>
    </div>
    <div class="bl-grid">
      <canvas class="bl-map"></canvas>
      <canvas class="bl-chart"></canvas>
    </div>
    <div class="bl-leg">
      <span><i style="background:${COLORS.dim}"></i>random</span>
      <span><i style="background:${COLORS.orange}"></i>2-opt estimates</span>
      <span><i style="background:${COLORS.green}"></i>CombUCB / LCB</span>
      <span><i style="background:${COLORS.red}"></i>optimal 7542</span>
    </div>
    <div class="bl-controls">
      <button class="primary" data-f="play">▶ play</button>
      <button data-f="step">+1 tour</button>
      <button data-f="step50">+50</button>
      <button data-f="reveal">reveal best-known</button>
      <button data-f="reset">reset (new seed)</button>
      <label>draw tour <select data-f="policy">
        <option value="random">random tours</option>
        <option value="estimate">2-opt estimates</option>
        <option value="ucb" selected>CombUCB (LCB)</option>
        <option value="manual">manual (click cities)</option>
      </select></label>
      <button data-f="runmanual" style="display:none">run my tour</button>
      <button data-f="clearmanual" style="display:none">clear</button>
    </div>
    <div class="bl-note" data-f="note">52 Berlin locations, edge distances <b>hidden until traversed</b>. Each policy traverses one tour per round and observes noisy per-edge samples. CombUCB minimises a lower-confidence-bound cost so it probes under-sampled short edges, and 2-opt on those beliefs converges toward 7542.</div>`;
  const $=s=>root.querySelector(`[data-f="${s}"]`);
  const mapC=root.querySelector('.bl-map'), chartC=root.querySelector('.bl-chart');

  function init(s){
    seed=s;
    runs=POLICIES.map((p,pi)=>({key:p.key,color:p.color,rand:rng(s*131+pi*97+1),
      bel:makeBeliefs(),t:0,best:Infinity,bestTour:null,incumbent:null,recTour:null,hist:[],noise:NOISE,bonus:BONUS,passes:PASSES}));
    ref=null;manual=null;
  }
  const byKey=k=>runs.find(r=>r.key===k);

  function stepAll(){runs.forEach(r=>{const res=policyRound(r.key,r);r.hist.push(r.best);});}
  function instant(n){for(let k=0;k<n;k++)stepAll();draw();}

  // ----- geometry for map -----
  function mapTransform(W,H){
    let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
    for(const[x,y]of BERLIN){if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;}
    const pad=18,iw=W-2*pad,ih=H-2*pad;
    const sx=iw/(maxx-minx),sy=ih/(maxy-miny),sc=Math.min(sx,sy);
    const ox=pad+(iw-(maxx-minx)*sc)/2, oy=pad+(ih-(maxy-miny)*sc)/2;
    return p=>[ox+(p[0]-minx)*sc, H-(oy+(p[1]-miny)*sc)]; // flip y for map-like look
  }
  function drawMap(){
    const dpr=window.devicePixelRatio||1,W=mapC.clientWidth||420,H=300;
    if(mapC.width!==W*dpr){mapC.width=W*dpr;mapC.height=H*dpr;}mapC.style.height=H+'px';
    const c=mapC.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    const T=mapTransform(W,H);
    // tour to draw
    let tour=null,col=COLORS.green,bel=byKey('ucb').bel,label='';
    if(drawKey==='manual'){tour=manual&&manual.length>1?manual:null;col=COLORS.blue;label='manual tour';}
    else{const r=byKey(drawKey);tour=r.bestTour;col=r.color;bel=r.bel;label='best '+POLICIES.find(p=>p.key===drawKey).label;}
    // reveal reference tour underneath
    if(ref){c.strokeStyle='rgba(225,108,108,.55)';c.lineWidth=1.4;c.setLineDash([4,4]);c.beginPath();
      ref.tour.forEach((v,i)=>{const p=T(BERLIN[v]);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);});
      const p0=T(BERLIN[ref.tour[0]]);c.lineTo(p0[0],p0[1]);c.stroke();c.setLineDash([]);}
    // tour path with uncertainty shading per edge
    if(tour){
      for(let k=0;k<tour.length;k++){
        const a=tour[k],b=tour[(k+1)%tour.length];
        const pa=T(BERLIN[a]),pb=T(BERLIN[b]);
        let alpha=0.85;
        if(drawKey!=='manual'&&bel){const e=eidx(a,b),n=bel.cnt[e];alpha=n>0?clamp(0.35+0.12*n,0.4,0.95):0.18;}
        c.strokeStyle=col;c.globalAlpha=alpha;c.lineWidth=1.8;
        c.beginPath();c.moveTo(pa[0],pa[1]);c.lineTo(pb[0],pb[1]);c.stroke();
      }
      c.globalAlpha=1;
    }
    // cities
    for(let i=0;i<N;i++){const p=T(BERLIN[i]);c.fillStyle=COLORS.fg;c.beginPath();c.arc(p[0],p[1],2.3,0,7);c.fill();}
    // manual highlight + numbering
    if(drawKey==='manual'&&manual){manual.forEach((v,i)=>{const p=T(BERLIN[v]);c.fillStyle=COLORS.blue;c.beginPath();c.arc(p[0],p[1],4,0,7);c.fill();
      c.fillStyle=COLORS.dim;c.font='9px '+'ui-monospace,monospace';c.fillText(String(i+1),p[0]+5,p[1]-3);});}
    // label
    c.fillStyle=COLORS.dim;c.font='10px ui-monospace,monospace';c.textAlign='left';
    c.fillText(label+(tour&&drawKey!=='manual'?'  ('+Math.round(byKey(drawKey).best)+')':''),8,H-8);
    if(ref){c.fillStyle=COLORS.red;c.textAlign='right';c.fillText('best-known '+Math.round(ref.cost),W-8,H-8);c.textAlign='left';}
  }

  function drawChart(){
    const dpr=window.devicePixelRatio||1,W=chartC.clientWidth||420,H=300;
    if(chartC.width!==W*dpr){chartC.width=W*dpr;chartC.height=H*dpr;}chartC.style.height=H+'px';
    const c=chartC.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    const pl=46,pr=12,pt=14,pb=24,pw=W-pl-pr,ph=H-pt-pb;
    // y range: from OPT to max best cost seen (capped)
    let ymax=OPT*1.15;for(const r of runs)for(const v of r.hist)if(isFinite(v)&&v<OPT*3.2&&v>ymax)ymax=v;
    const ymin=OPT*0.96;
    const Y=v=>pt+(1-clamp((v-ymin)/(ymax-ymin),0,1))*ph;
    const xmax=Math.max(...runs.map(r=>r.hist.length),20);
    c.strokeStyle='rgba(255,255,255,.06)';c.fillStyle=COLORS.dim;c.font='10px ui-monospace,monospace';
    for(let g=0;g<=4;g++){const v=ymin+(ymax-ymin)*g/4;const y=Y(v);c.beginPath();c.moveTo(pl,y);c.lineTo(pl+pw,y);c.stroke();c.fillText(Math.round(v),4,y+3);}
    // optimal line
    const yo=Y(OPT);c.strokeStyle=COLORS.red;c.setLineDash([5,4]);c.beginPath();c.moveTo(pl,yo);c.lineTo(pl+pw,yo);c.stroke();c.setLineDash([]);
    c.fillStyle=COLORS.red;c.textAlign='right';c.fillText('7542',pl+pw,yo-3);c.textAlign='left';
    c.fillStyle=COLORS.dim;c.fillText('round '+(runs[0]?runs[0].t:0),pl+2,H-7);
    c.fillText('best true cost',6,pt-3);
    // curves (best-so-far)
    for(const r of runs){if(r.hist.length<1)continue;c.strokeStyle=r.color;c.lineWidth=2;c.beginPath();
      r.hist.forEach((v,i)=>{const x=pl+(xmax>1?i/(xmax-1):0)*pw,y=Y(v);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();}
    // current % labels
    let ly=pt+10;c.textAlign='right';
    for(const r of runs){if(!isFinite(r.best))continue;c.fillStyle=r.color;const pct=(r.best/OPT-1)*100;c.fillText(pct.toFixed(1)+'%',W-pr-2,ly);ly+=13;}
    c.textAlign='left';
  }

  function updateCards(){
    const r=drawKey==='manual'?byKey('ucb'):byKey(drawKey);
    $('tours').textContent=runs[0]?runs[0].t:0;
    $('best').textContent=isFinite(r.best)?Math.round(r.best):'—';
    $('gap').textContent=isFinite(r.best)?((r.best/OPT-1)*100).toFixed(1)+'%':'—';
    let seen=0;const big=byKey('ucb').bel;for(let e=0;e<NEDGES;e++)if(big.cnt[e]>0)seen++;
    // count union across policies for "distinct edges observed"
    const merged=new Uint8Array(NEDGES);for(const rr of runs)for(let e=0;e<NEDGES;e++)if(rr.bel.cnt[e]>0)merged[e]=1;
    let total=0;for(let e=0;e<NEDGES;e++)if(merged[e])total++;
    $('edges').textContent=total;
  }
  function draw(){drawMap();drawChart();updateCards();}

  function loop(){if(!playing)return;for(let k=0;k<2;k++)stepAll();draw();raf=requestAnimationFrame(loop);}

  // ----- controls -----
  $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ pause':'▶ play';if(playing)loop();};
  $('step').onclick=()=>{stepAll();draw();};
  $('step50').onclick=()=>{instant(50);};
  $('reveal').onclick=()=>{ref=bestKnown(rng(seed*7+11),12);draw();
    $('note').innerHTML='Best-known reference tour (multi-restart 2-opt on TRUE distances) overlaid in <b style="color:'+COLORS.red+'">red</b> at cost '+Math.round(ref.cost)+'. The CombUCB curve is closing on it without ever being told the distances up front.';};
  $('reset').onclick=()=>{playing=false;$('play').textContent='▶ play';init(((Date.now()&0xffff)||1)+1);draw();};
  $('policy').onchange=e=>{drawKey=e.target.value;const m=drawKey==='manual';
    $('runmanual').style.display=m?'':'none';$('clearmanual').style.display=m?'':'none';
    if(m&&!manual)manual=[];draw();};
  $('clearmanual').onclick=()=>{manual=[];draw();};
  $('runmanual').onclick=()=>{if(!manual||manual.length<N){$('note').textContent='Click all 52 cities (in visiting order) to build a complete tour, then run it.';return;}
    const ub=byKey('ucb');for(let k=0;k<manual.length;k++){const a=manual[k],b=manual[(k+1)%manual.length];observe(ub.bel,a,b,noisy(a,b,ub.rand,ub.noise));}
    const cost=tourCost(manual,TRUE);if(cost<ub.best){ub.best=cost;ub.bestTour=manual.slice();}
    $('note').innerHTML='Your tour cost <b>'+Math.round(cost)+'</b> ('+((cost/OPT-1)*100).toFixed(1)+'% over optimal). Its edges were observed and folded into CombUCB\'s beliefs.';draw();};

  mapC.addEventListener('click',ev=>{
    if(drawKey!=='manual')return;
    const rect=mapC.getBoundingClientRect();const W=mapC.clientWidth||420,H=300;
    const mx=(ev.clientX-rect.left),my=(ev.clientY-rect.top);
    const T=mapTransform(W,H);let bn=-1,bd=Infinity;
    for(let i=0;i<N;i++){const p=T(BERLIN[i]);const d=(p[0]-mx)**2+(p[1]-my)**2;if(d<bd){bd=d;bn=i;}}
    if(bd<400&&bn>=0&&!manual.includes(bn)){manual.push(bn);draw();}
  });

  window.addEventListener('resize',draw);
  init(seed);draw();

  return {api:{
    instant,
    reset:init,
    state:()=>{const u=byKey('ucb');const cost=isFinite(u.best)?u.best:OPT*3;return {cost,gap:cost/OPT-1,
      estCost:(function(){const e=byKey('estimate');return isFinite(e.best)?e.best:OPT*3;})(),
      randCost:(function(){const r=byKey('random');return isFinite(r.best)?r.best:OPT*3;})(),
      rounds:u.t};}
  }};
}
window.__component={name:'tsp/berlin52',mount:mountBerlin52};
if(typeof document!=='undefined'){const st=document.getElementById('stage');if(st)mountBerlin52(st,{});}
</script>
</body>
