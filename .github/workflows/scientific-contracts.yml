name: Scientific contracts

on:
  push:
    branches:
      - agent/icml-scientific-audit
  pull_request:

permissions:
  contents: read

jobs:
  scientific-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Compile Python sources
        run: python -m compileall -q edp tests
      - name: Run scientific contract tests
        run: python tests/test_scientific_contracts.py
